<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Дашборд</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='app.css') }}?v=20260805-1"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='dashboard.css') }}?v=20260806-11"
    >
</head>

<body class="dashboard-page">
    <div class="dashboard-strip">
        Режим администратора
    </div>

    <header class="dashboard-header">
        <div class="dashboard-header__left">
            <div class="dashboard-header__program">
                Цифровая маркировка и контроль ФГИС
            </div>

            <div class="dashboard-header__user">
                ФИО пользователя
            </div>
        </div>

        <div class="dashboard-header__center">
            <h1
                id="dashboard-current-title"
                class="dashboard-header__title"
            >
                Дашборд
            </h1>
        </div>
    </header>

    <nav
        class="dashboard-navigation"
        aria-label="Навигация дашборда"
    >
        <button
            class="dashboard-nav-button dashboard-nav-button--active"
            type="button"
            aria-current="page"
            aria-disabled="true"
        >
            Основная
        </button>

        <button
            class="dashboard-nav-button"
            type="button"
            aria-disabled="true"
        >
            Отчеты
        </button>
    </nav>

    <section
        class="dashboard-filter-bar"
        aria-label="Фильтры дашборда"
    >
        <div class="dashboard-filter">
            <span class="dashboard-filter__label">
                Период
            </span>

            <button
                id="dashboard-period-value"
                class="dashboard-filter__button"
                type="button"
                aria-disabled="true"
            >
                01.07.2026 — 04.08.2026
            </button>
        </div>

        <div class="dashboard-filter">
            <span class="dashboard-filter__label">
                ТТ
            </span>

            <button
                id="dashboard-trade-point-value"
                class="dashboard-filter__button"
                type="button"
                aria-disabled="true"
            >
                Все ТТ
            </button>
        </div>

        <div class="dashboard-filter">
            <span class="dashboard-filter__label">
                Организация
            </span>

            <button
                id="dashboard-organization-value"
                class="dashboard-filter__button"
                type="button"
                aria-disabled="true"
            >
                Все организации
            </button>
        </div>
    </section>

    <main class="dashboard-workspace">
        <div
            class="dashboard-quick-actions"
            aria-label="Быстрые действия"
        >
            <button
                id="dashboard-share-link"
                class="dashboard-quick-action-button"
                type="button"
                aria-label="Поделиться ссылкой"
                data-action-tooltip="Поделиться ссылкой"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <circle cx="18" cy="5" r="2.5"></circle>
                    <circle cx="6" cy="12" r="2.5"></circle>
                    <circle cx="18" cy="19" r="2.5"></circle>
                    <path d="M8.2 10.8L15.8 6.2"></path>
                    <path d="M8.2 13.2L15.8 17.8"></path>
                </svg>
            </button>

            <button
                id="dashboard-download-pdf"
                class="dashboard-quick-action-button"
                type="button"
                aria-label="Скачать PDF"
                data-action-tooltip="Скачать PDF"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M12 3.5V15"></path>
                    <path d="M7.8 10.8L12 15L16.2 10.8"></path>
                    <path d="M5 20H19"></path>
                </svg>
            </button>
        </div>
        <aside
            class="dashboard-side-panel"
            aria-label="Разделы детализации"
        >
            <div class="dashboard-side-panel__buttons">
                <button
                    class="dashboard-detail-button dashboard-detail-button--active"
                    type="button"
                    aria-current="page"
                >
                    Общая
                </button>

                <button
                    class="dashboard-detail-button"
                    type="button"
                    aria-disabled="true"
                >
                    Документы
                </button>

                <button
                    class="dashboard-detail-button"
                    type="button"
                    aria-disabled="true"
                >
                    КИ
                </button>

                <button
                    class="dashboard-detail-button"
                    type="button"
                    aria-disabled="true"
                >
                    Отклонения
                </button>
            </div>
        </aside>

        <section class="dashboard-canvas">
            <div class="dashboard-canvas__body">
                <section
                    class="dashboard-circle-zone"
                    aria-label="Основные показатели"
                >
                    <section
                        class="dashboard-shape dashboard-shape--sales"
                        aria-label="Продажи"
                    >
                        <div
                            id="sales-chart"
                            class="dashboard-shape__chart"
                        ></div>
                    </section>

                    <section
                        class="dashboard-shape dashboard-shape--violations"
                        aria-label="Отклонения"
                    >
                        <div
                            id="violations-chart"
                            class="dashboard-shape__chart"
                        ></div>
                    </section>

                    <section
                        class="dashboard-shape dashboard-shape--penalties"
                        aria-label="Штрафы"
                    >
                        <div
                            id="penalties-chart"
                            class="dashboard-shape__chart"
                        ></div>
                    </section>

                    <section
                        class="dashboard-shape dashboard-shape--documents"
                        aria-label="Документы"
                    >
                        <div
                            id="documents-chart"
                            class="dashboard-shape__chart"
                        ></div>
                    </section>
                </section>

                <section class="dashboard-lower-zone">
                    <section
                        id="dashboard-trend-zone"
                        class="dashboard-trend-zone"
                        aria-label="Тренды штрафов и отклонений"
                    >
                        <div
                            class="dashboard-trend-toolbar"
                            aria-label="Управление масштабом трендов"
                        >
                            <button
                                id="dashboard-trend-zoom-in"
                                class="dashboard-trend-zoom-button"
                                type="button"
                                aria-label="Увеличить масштаб"
                                title="Увеличить масштаб"
                            >
                                +
                            </button>

                            <button
                                id="dashboard-trend-zoom-out"
                                class="dashboard-trend-zoom-button"
                                type="button"
                                aria-label="Уменьшить масштаб"
                                title="Уменьшить масштаб"
                            >
                                −
                            </button>
                        </div>

                        <div
                            id="dashboard-trend-chart"
                            class="dashboard-trend-chart"
                        >
                            <div class="dashboard-chart-placeholder">
                                Загрузка тренда…
                            </div>
                        </div>
                    </section>

                    <section
                        class="dashboard-table-zone"
                        aria-label="Программируемая таблица"
                    >
                        <div class="dashboard-table-wrap">
                            <table class="dashboard-programmable-table">
                                <thead>
                                    <tr>
                                        <th></th>
                                        <th></th>
                                        <th></th>
                                        <th></th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>

                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>

                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>

                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </section>
            </div>
        </section>
    </main>

    <div
        id="dashboard-pdf-modal"
        class="dashboard-pdf-modal"
        hidden
    >
        <div
            class="dashboard-pdf-modal__backdrop"
            data-pdf-modal-close
        ></div>

        <section
            class="dashboard-pdf-dialog"
            role="dialog"
            aria-modal="true"
            aria-labelledby="dashboard-pdf-dialog-title"
        >
            <h2
                id="dashboard-pdf-dialog-title"
                class="dashboard-pdf-dialog__title"
            >
                Скачать дашборд
            </h2>

            <label
                class="dashboard-pdf-dialog__field"
                for="dashboard-pdf-filename"
            >
                <span class="dashboard-pdf-dialog__label">
                    Имя файла
                </span>

                <input
                    id="dashboard-pdf-filename"
                    class="dashboard-pdf-dialog__input"
                    type="text"
                    autocomplete="off"
                    maxlength="120"
                >
            </label>

            <div
                id="dashboard-pdf-status"
                class="dashboard-pdf-dialog__status"
                aria-live="polite"
            ></div>

            <div class="dashboard-pdf-dialog__actions">
                <button
                    id="dashboard-pdf-cancel"
                    class="dashboard-pdf-dialog__button dashboard-pdf-dialog__button--secondary"
                    type="button"
                >
                    Отмена
                </button>

                <button
                    id="dashboard-pdf-confirm"
                    class="dashboard-pdf-dialog__button dashboard-pdf-dialog__button--primary"
                    type="button"
                >
                    Скачать
                </button>
            </div>
        </section>
    </div>

    <footer
        class="dashboard-bottom-controls"
        aria-label="Нижняя панель управления"
    >
        <div class="dashboard-bottom-control">
            <span class="dashboard-bottom-control__label">
                Шаблон
            </span>

            <button
                class="dashboard-bottom-control__button"
                type="button"
                aria-disabled="true"
            >
                Базовый
            </button>
        </div>

        <div class="dashboard-bottom-control">
            <span class="dashboard-bottom-control__label">
                Видимость
            </span>

            <button
                class="dashboard-bottom-control__button"
                type="button"
                aria-disabled="true"
            >
                Все блоки
            </button>
        </div>
    </footer>

    <a
        class="dashboard-back-button"
        href="{{ url_for('index') }}"
        aria-label="Перейти в панель администратора"
        title="Перейти в панель администратора"
    >
        <span
            class="dashboard-back-button__arrow"
            aria-hidden="true"
        >
            ↙
        </span>

        <span class="dashboard-back-button__text">
            Панель администратора
        </span>
    </a>

    <script
        src="{{ url_for('static', filename='dashboard.js') }}?v=20260806-11"
        defer
    ></script>

    <script
        src="{{ url_for('static', filename='dashboard_pdf.js') }}?v=20260806-2"
        defer
    ></script>
</body>
</html>
