name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python modules
        run: |
          python -m compileall apps/sync_worker/app

      - name: Ruff critical checks
        run: |
          ruff check apps/sync_worker/app tests

      - name: Run unit tests
        run: |
          pytest

      - name: Validate Postman JSON
        run: |
          python -m json.tool \
            postman/GIS_MT.postman_collection.json \
            > /dev/null

      - name: Build sync-worker image
        run: |
          docker build \
            --tag gis-mt-sync-worker-ci \
            apps/sync_worker