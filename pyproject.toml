[tool.pytest.ini_options]
pythonpath = ["apps/sync_worker"]
testpaths = ["tests"]
addopts = "-q"


[tool.black]
line-length = 100
target-version = ["py312"]


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
# На первом этапе включены только правила,
# выявляющие ошибки исполнения и некорректные имена.
#
# Полный набор правил включим после функционального
# рефакторинга и форматирования существующего кода.

select = [
    "E9",
    "F63",
    "F7",
    "F82",
]